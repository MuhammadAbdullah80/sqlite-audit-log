name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlite version
        run: sqlite3 --version
      - name: Run the test suite
        run: bash tests/run.sh
      - name: Confirm the schema loads into a clean database
        run: |
          sqlite3 fresh.db ".read schema.sql"
          sqlite3 fresh.db "SELECT type, name FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name;"
